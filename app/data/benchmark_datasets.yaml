    source_study: PRJNA314297 (SRP071140)
    study_title: RNA-seq analysis of Fusarium graminearum Z-3639 in heat stress
    geo_series: GSE78885
    source_publication: Bui et al. (2016) Scientific Reports 6:28154, DOI 10.1038/srep28154 (PubMed 27306495),
      the publication ENA links from PRJNA314297
    description: >-
      Six-sample paired-end heat-shock contrast in Fusarium graminearum wild-type strain Z-3639: three cultures
      held at 25 C and three shifted to 37 C for 15 min, 151 bp mates on an Illumina HiSeq 2000. The library
      is reverse-stranded, which makes this the catalogue's strandedness case: it is the dataset that exposes
      a strandedness regression, because counting it as unstranded changes the differential result rather
      than merely slowing it down.
    notes:
      - >-
        The sequenced strain is the wild type Z-3639 (ENA scientific_name Fusarium graminearum, taxon 5518);
        reads are mapped to the bundled Fusarium graminearum PH-1 reference preset, and the PH-1 taxon 229533
        is used as the STRING species proxy. Interpret strain-specific loci accordingly.
      - >-
        Reverse-stranded library: the 0.2x-era runs counted it with featureCounts -s 2. The pipeline auto-detects
        strandedness, so a detected value other than 2 is a regression in detection, not a property of the
        data.
      - 'No Bioconductor OrgDb exists for F. graminearum: GO comes from g:Profiler (fgraminearum), KEGG
        uses organism code fgr with locus_tag keys, and STRING uses taxon 229533.'
      - 'Known issue in 0.32.1: the KEGG identity check compares organism names exactly and rejects fgr
        (Fusarium graminearum) for the configured Fusarium graminearum PH-1, although both are taxon 5518,
        and g:Profiler returns no GO terms for these identifiers, so check 10 ends REVIEW_REQUIRED.'
      - Three biological replicates per temperature, one ENA run each, as stated in the study's own overall
        design.
      - Use allow_pending_sra validation until the FASTQ files are downloaded. Subset download ~9.5 GB.
    expected:
      status: first recorded in the 0.2x-era runs; the STAR + featureCounts + DESeq2 result was reproduced
