  - id: arabidopsis_hub2_microarray
    type: microarray
    name: Arabidopsis hub2-3 mutant vs Col-0 (ATH1 microarray)
    organism_name: Arabidopsis thaliana
    reference_preset: Arabidopsis thaliana
    genome_size_category: plant
    microarray:
      gse_accession: GSE30735
      platform: GPL198
      source: geo_series_matrix
    contrast:
      name: hub2_3_vs_wild_type
      factor: condition
      numerator: hub2_3
      denominator: wild_type
      reference_level: wild_type
    source_study: GSE30735 (BioProject PRJNA144135)
    study_title: Transcriptome of the Arabidopsis hub2-3 (histone H2B monoubiquitination) mutant vs Col-0
    description: >
      Six-sample Affymetrix ATH1 microarray benchmark for the microarray (limma) route:
      three Col-0 wild-type and three hub2-3 loss-of-function mutant 12-day-old whole
      seedlings. HUB2 is a RING E3 ligase that monoubiquitinates histone H2B, so the hub2-3
      knockout gives a clean single-gene-perturbation differential signature in the canonical
      model plant Arabidopsis thaliana. No FASTQ or alignment: GEOquery ingests the submitter-normalized intensities and
      limma runs the differential test, mirroring the pasilla perturb-vs-control design.
    notes:
      - Microarray benchmark (no alignment or genome reference); GEOquery downloads the GSE30735 series matrix and GPL198 annotation. Probes map to gene symbols, so enrichment keys on SYMBOL.
      - Arabidopsis enrichment runs GO via clusterProfiler with org.At.tair.db (SYMBOL bitr), plus KEGG ath and g:Profiler athaliana as the organism-appropriate routes.
      - Small download and 6 samples make this a fast end-to-end check of the microarray route in a plant model organism.
    samples:
      - {sample_id: GSM762823, condition: wild_type}
      - {sample_id: GSM762824, condition: wild_type}
      - {sample_id: GSM762825, condition: wild_type}
      - {sample_id: GSM762826, condition: hub2_3}
      - {sample_id: GSM762827, condition: hub2_3}
      - {sample_id: GSM762828, condition: hub2_3}
  - id: yeast_cbc2_microarray
    type: microarray
    name: Yeast cbc2-delta vs wild-type (YG-S98 microarray)
    organism_name: Saccharomyces cerevisiae
    reference_preset: Saccharomyces cerevisiae
    genome_size_category: yeast
    microarray:
      gse_accession: GSE6705
      platform: GPL90
      source: geo_series_matrix
    contrast:
      name: cbc2_vs_wild_type
      factor: condition
      numerator: cbc2
      denominator: wild_type
      reference_level: wild_type
    source_study: GSE6705 (BioProject PRJNA99021)
    study_title: Transcripts regulated by the nuclear cap-binding complex subunit Cbc2 in Saccharomyces cerevisiae
    description: >
      Six-sample Affymetrix Yeast Genome S98 (YG-S98) microarray benchmark for the microarray
      (limma) route: three isogenic wild-type (Y255) and three cbc2-delta deletion (Y2685)
      strains. Cbc2 is the small subunit of the nuclear cap-binding complex; the deletion gives
      a clean, high-signal knockout contrast in the canonical fungal model organism Saccharomyces cerevisiae. GEOquery
      ingests the submitter-normalized intensities and limma runs the differential test; no
      alignment or reference.
    notes:
      - Microarray benchmark (no alignment or genome reference); GEOquery downloads the GSE6705 series matrix and GPL90 annotation. Probes map to gene names, and the configured SYMBOL namespace is translated explicitly to org.Sc.sgd.db GENENAME.
      - Yeast enrichment runs GO via clusterProfiler with org.Sc.sgd.db (effective GENENAME mapping), plus KEGG sce and g:Profiler scerevisiae.
      - A fungal model system distinct from the Arabidopsis benchmark, exercising the microarray route on a compact fungal genome.
    samples:
      - {sample_id: GSM154157, condition: wild_type}
      - {sample_id: GSM154623, condition: wild_type}
      - {sample_id: GSM154627, condition: wild_type}
      - {sample_id: GSM154628, condition: cbc2}
      - {sample_id: GSM154629, condition: cbc2}
      - {sample_id: GSM154631, condition: cbc2}
  - id: fg_spores_mycelium_paired
    name: Fusarium graminearum PH-1 spores vs mycelium paired-end
    organism_name: Fusarium graminearum PH-1
    reference_preset: Fusarium graminearum PH-1
    genome_size_category: fungal
    contrast:
      name: spores_vs_mycelium
      factor: condition
      numerator: spores
      denominator: mycelium
      reference_level: mycelium
    reference:
      source: NCBI RefSeq
      release: RefSeq ASM24013v3
      assembly: ASM24013v3
      annotation_format: gtf
      genome_fasta_url: https://ftp.ncbi.nlm.nih.gov/genomes/all/GCF/000/240/135/GCF_000240135.3_ASM24013v3/GCF_000240135.3_ASM24013v3_genomic.fna.gz
      annotation_gtf_url: https://ftp.ncbi.nlm.nih.gov/genomes/all/GCF/000/240/135/GCF_000240135.3_ASM24013v3/GCF_000240135.3_ASM24013v3_genomic.gtf.gz
      genome_md5: ac33f0ca12087c03a69ee83557c2c586
      annotation_md5: 0b3da4174e6bc37111a3b6c7792c2cf1
    source_study: PRJNA239711 (SRP039087)
    study_title: Genome-wide gene expression analysis of Fusarium graminearum isolate PH-1 in spores and
      mycelium
    geo_series: GSE55477
    source_publication: Zhao et al. (2014) BMC Genomics 15:191, DOI 10.1186/1471-2164-15-191 (PubMed 24625133),
      the publication ENA links from PRJNA239711
    description: >-
      Six-sample paired-end developmental contrast in the reference Fusarium graminearum strain PH-1: three
      spore and three mycelium biological replicates, 90 bp mates on an Illumina HiSeq 2000. This is the
      primary fungal guardrail benchmark: a compact (~36 Mb) genome, a large and stable differential signal
      between two developmental stages, and an unstranded library, so a run exercises the STAR + featureCounts
      + DESeq2 route and the KEGG/STRING fungal enrichment path end to end in well under an hour of compute.
    notes:
      - One ENA run per biological sample; three biological replicates per developmental stage, as stated
        in the study's own overall design.
      - organism_name names the bundled Fusarium graminearum PH-1 reference preset, which is also the sequenced
        strain here (ENA scientific_name Fusarium graminearum PH-1, taxon 229533).
      - 'No Bioconductor OrgDb exists for F. graminearum: GO comes from g:Profiler (fgraminearum), KEGG
        uses organism code fgr with locus_tag keys, and STRING uses taxon 229533.'
      - 'Known issue in 0.32.1: the KEGG identity check compares organism names exactly and rejects fgr
        (Fusarium graminearum) for the configured Fusarium graminearum PH-1, although both are taxon 5518,
        and g:Profiler returns no GO terms for these identifiers, so check 10 ends REVIEW_REQUIRED.'
      - The library is unstranded; the pipeline auto-detects strandedness, so a detected value other than
        0 means the run, not the catalogue, has drifted.
