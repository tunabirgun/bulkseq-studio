  - id: sc_ume6_paired
    name: Yeast rpd3-delta Ume6 delta2-508 paired-end subset
    organism_name: Saccharomyces cerevisiae
    reference_preset: Saccharomyces cerevisiae
    genome_size_category: yeast
    contrast:
      name: rpd3_ume6_delta_2_508_vs_rpd3_delta
      factor: condition
      numerator: rpd3_ume6_delta_2_508
      denominator: rpd3_delta
      reference_level: rpd3_delta
    reference:
      source: Ensembl
      release: "111"
      assembly: R64-1-1
      annotation_format: gtf
      genome_fasta_url: https://ftp.ensembl.org/pub/release-111/fasta/saccharomyces_cerevisiae/dna/Saccharomyces_cerevisiae.R64-1-1.dna.toplevel.fa.gz
      annotation_gtf_url: https://ftp.ensembl.org/pub/release-111/gtf/saccharomyces_cerevisiae/Saccharomyces_cerevisiae.R64-1-1.111.gtf.gz
      genome_md5: 5ae49d2d22cd977abdd6b054b94c544d
      annotation_md5: cc468f46d052afab93fb7c9c791cef22
    source_study: PRJNA630199 (SRP260000)
    study_title: Basis of Specificity for a Conserved Promiscuous Chromatin Remodeling Protein [RNA-Seq]
    description: >
      Four-sample paired-end subset of GSE149803: two rpd3-delta controls with
      wild-type Ume6 and two rpd3-delta biological replicates carrying the Ume6
      delta2-508 N-terminal truncation. This matches the study's mechanistic
      contrast: rpd3 deletion removes Rpd3 repression, while Ume6 delta2-508 also
      removes the Isw2-recruitment region, producing derepression at Ume6 target
      genes. The small (~12 Mb) genome makes this a fast end-to-end benchmark on
      a different organism than the Drosophila pasilla set.
    notes:
      - One ENA run per biological sample, with two biological replicates for each genotype. The contrast follows Donovan et al. (2021), eLife 10:e64061, DOI 10.7554/eLife.64061.
      - Ume6 delta2-508 is an N-terminal truncation in an rpd3-delta background, not a complete UME6 gene deletion; biological interpretation must remain specific to this combined perturbation.
      - Yeast enrichment uses org.Sc.sgd.db when available and translates the configured SYMBOL namespace to its GENENAME namespace; unresolved mappings remain excluded. KEGG uses organism code sce.
      - GEO records strand-specific NuGEN Universal mRNA libraries. Catalog entries preserve each ENA archive mate designation; strand-orientation QC remains an execution gate.
      - Use allow_pending_sra validation until the FASTQ files are downloaded.
