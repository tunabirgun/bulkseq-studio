# macOS / Apple Silicon (osx-arm64) — TOOLS prefix.
#
# WHY THIS EXISTS, AND WHY IT IS SPLIT FROM THE R STACK
#   On osx-arm64 the alignment tools and the R stack cannot share one prefix.
#   htslib/samtools/salmon/fastp pin `libdeflate >=1.22,<1.23`, while r-base 4.5.2
#   (which the whole Bioconductor graph needs) pins `libdeflate >=1.24,<1.26`.
#   On linux-64 and osx-64 bioconda's repodata patches widen the tool bounds to
#   <1.26 and the conflict disappears; that patch coverage was never extended to
#   osx-arm64. Verified on real Apple Silicon (macOS 27, M5 Pro): a single-prefix
#   solve fails on exactly that constraint, and these two prefixes each solve at
#   the protocol-pinned versions.
#
#   Pair this with bulkseq_macos_arm64_r.yaml. See scripts/setup_wsl_bioenv.sh for
#   how the two prefixes are created and how Rscript is reached from the pipeline.
#
# DIFFERENCES FROM bulkseq_core.yaml (both deliberate, both verified absent on osx-arm64)
#   - sortmerna:    no osx-arm64 conda build at ANY version. 4.3.7's bundled SSW
#                   aligner includes <emmintrin.h> (x86 SSE2). Upstream ships a
#                   native arm64 binary from 4.4.0 on; the setup script installs it
#                   from the GitHub release with a pinned checksum. Confirmed a
#                   drop-in for rules/rrna.smk by scripts/test_sortmerna_macos.sh.
#   - fastq-screen: blocked by perl-gd, which has no osx-arm64 build. Its output is
#                   optional (rules/qc.smk declares only _screen.txt, and moves the
#                   PNG with `|| true`); restore it once the perl-gd recipe opts in.
#
# The three packages that float in bulkseq_core.yaml are pinned here to the exact
# versions in bulkseq.lock.yaml, so a macOS solve cannot silently drift away from
# the validated Linux environment.
name: bulkseq
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.12
  - snakemake-minimal=9.23.1
  - aria2=1.37.0
  - fastqc=0.12.1
  - multiqc=1.30
  - fastp=1.0.1
  - star=2.7.11b
  - hisat2=2.2.2
  - salmon=1.10.3
  - gffread=0.12.9
  - samtools=1.22.1
  - subread=2.1.1
  # Preprocessing alternatives (opt-in; fastp remains the default trimmer).
  - trim-galore=2.3.0
  - cutadapt=5.2
  - pigz=2.8
  - trimmomatic=0.40
  - bowtie2=2.5.5
  # RiboDetector is the reference-free rRNA filter. It is noarch, so it is available
  # here and covers the rRNA-filtering function while SortMeRNA comes from upstream.
  - ribodetector=0.2.7
  # RSeQC extended alignment QC (opt-in) + the GTF->BED12 gene-model tools it needs.
  - rseqc=5.0.4
  - ucsc-gtftogenepred=482
  - ucsc-genepredtobed=482
  - pandas
  - pyyaml
