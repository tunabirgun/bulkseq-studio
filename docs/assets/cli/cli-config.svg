<svg xmlns="http://www.w3.org/2000/svg" width="817" height="310" viewBox="0 0 817 310" role="img" aria-label="Configuration is validated, not just written">
  <rect width="817" height="310" rx="10" fill="#15162a"/>
  <rect width="817" height="34" rx="10" fill="#1d1f38"/>
  <rect y="24" width="817" height="10" fill="#1d1f38"/>
  <circle cx="18" cy="17" r="5.5" fill="#ff5f57"/><circle cx="36" cy="17" r="5.5" fill="#febc2e"/><circle cx="54" cy="17" r="5.5" fill="#28c840"/>
  <text x="409" y="22" fill="#9aa1b2" font-size="12" text-anchor="middle"
        font-family="ui-monospace, 'IBM Plex Mono', monospace">Configuration is validated, not just written</text>
  <g font-family="ui-monospace, 'IBM Plex Mono', 'SFMono-Regular', Consolas, monospace"
     font-size="13.5">
    <text x="18.0" y="68.0" xml:space="preserve"><tspan fill="#7ee2b8">$ </tspan><tspan fill="#e8e8f5">bulkseq config get deseq2.alpha</tspan></text>
    <text x="18.0" y="88.0" fill="#9aa1b2" xml:space="preserve">0.05</text>
    <text x="18.0" y="108.0" fill="#9aa1b2" xml:space="preserve"></text>
    <text x="18.0" y="128.0" xml:space="preserve"><tspan fill="#7ee2b8">$ </tspan><tspan fill="#e8e8f5">bulkseq config set deseq2.alpha 0.01</tspan></text>
    <text x="18.0" y="148.0" fill="#9aa1b2" xml:space="preserve">deseq2.alpha = 0.01</text>
    <text x="18.0" y="168.0" fill="#9aa1b2" xml:space="preserve"></text>
    <text x="18.0" y="188.0" xml:space="preserve"><tspan fill="#7ee2b8">$ </tspan><tspan fill="#e8e8f5">bulkseq config set deseq2.alpha 1.5</tspan></text>
    <text x="18.0" y="208.0" fill="#9aa1b2" xml:space="preserve">Invalid value for deseq2.alpha: 1 validation error for AppConfig</text>
    <text x="18.0" y="228.0" fill="#9aa1b2" xml:space="preserve">deseq2.alpha</text>
    <text x="18.0" y="248.0" fill="#9aa1b2" xml:space="preserve">Value error, deseq2.alpha must be between 0 and 1. [type=value_error, input_value=1.5,    \</text>
    <text x="18.0" y="268.0" fill="#9aa1b2" xml:space="preserve">    input_type=float]</text>
    <text x="18.0" y="288.0" fill="#9aa1b2" xml:space="preserve">    For further information visit https://errors.pydantic.dev/2.13/v/value_error</text>
  </g>
</svg>
