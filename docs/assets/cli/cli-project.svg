<svg xmlns="http://www.w3.org/2000/svg" width="560" height="330" viewBox="0 0 560 330" role="img" aria-label="Creating and inspecting a project">
  <rect width="560" height="330" rx="10" fill="#15162a"/>
  <rect width="560" height="34" rx="10" fill="#1d1f38"/>
  <rect y="24" width="560" height="10" fill="#1d1f38"/>
  <circle cx="18" cy="17" r="5.5" fill="#ff5f57"/><circle cx="36" cy="17" r="5.5" fill="#febc2e"/><circle cx="54" cy="17" r="5.5" fill="#28c840"/>
  <text x="280" y="22" fill="#9aa1b2" font-size="12" text-anchor="middle"
        font-family="ui-monospace, 'IBM Plex Mono', monospace">Creating and inspecting a project</text>
  <g font-family="ui-monospace, 'IBM Plex Mono', 'SFMono-Regular', Consolas, monospace"
     font-size="13.5">
    <text x="18.0" y="68.0" xml:space="preserve"><tspan fill="#7ee2b8">$ </tspan><tspan fill="#e8e8f5">bulkseq project create --name pasilla_demo --workdir ~</tspan></text>
    <text x="18.0" y="88.0" fill="#9aa1b2" xml:space="preserve">Created ~\pasilla_demo</text>
    <text x="18.0" y="108.0" fill="#9aa1b2" xml:space="preserve"></text>
    <text x="18.0" y="128.0" xml:space="preserve"><tspan fill="#7ee2b8">$ </tspan><tspan fill="#e8e8f5">bulkseq project info</tspan></text>
    <text x="18.0" y="148.0" fill="#9aa1b2" xml:space="preserve">project_root: ~\pasilla_demo</text>
    <text x="18.0" y="168.0" fill="#9aa1b2" xml:space="preserve">project_name: pasilla_demo</text>
    <text x="18.0" y="188.0" fill="#9aa1b2" xml:space="preserve">input_type: fastq</text>
    <text x="18.0" y="208.0" fill="#9aa1b2" xml:space="preserve">samples: 0</text>
    <text x="18.0" y="228.0" fill="#9aa1b2" xml:space="preserve">aligner: STAR</text>
    <text x="18.0" y="248.0" fill="#9aa1b2" xml:space="preserve">de_engine: DESeq2</text>
    <text x="18.0" y="268.0" fill="#9aa1b2" xml:space="preserve">design_formula: ~ condition</text>
    <text x="18.0" y="288.0" fill="#9aa1b2" xml:space="preserve">alpha: 0.05</text>
    <text x="18.0" y="308.0" fill="#9aa1b2" xml:space="preserve">organism: unset</text>
  </g>
</svg>
