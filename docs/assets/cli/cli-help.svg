<svg xmlns="http://www.w3.org/2000/svg" width="674" height="470" viewBox="0 0 674 470" role="img" aria-label="bulkseq --help">
  <rect width="674" height="470" rx="10" fill="#15162a"/>
  <rect width="674" height="34" rx="10" fill="#1d1f38"/>
  <rect y="24" width="674" height="10" fill="#1d1f38"/>
  <circle cx="18" cy="17" r="5.5" fill="#ff5f57"/><circle cx="36" cy="17" r="5.5" fill="#febc2e"/><circle cx="54" cy="17" r="5.5" fill="#28c840"/>
  <text x="337" y="22" fill="#9aa1b2" font-size="12" text-anchor="middle"
        font-family="ui-monospace, 'IBM Plex Mono', monospace">bulkseq --help</text>
  <g font-family="ui-monospace, 'IBM Plex Mono', 'SFMono-Regular', Consolas, monospace"
     font-size="13.5">
    <text x="18.0" y="68.0" xml:space="preserve"><tspan fill="#7ee2b8">$ </tspan><tspan fill="#e8e8f5">bulkseq --help</tspan></text>
    <text x="18.0" y="88.0" fill="#9aa1b2" xml:space="preserve">usage: bulkseq [-h] [-C PATH] [--json] [--quiet] COMMAND ...</text>
    <text x="18.0" y="108.0" fill="#9aa1b2" xml:space="preserve"></text>
    <text x="18.0" y="128.0" fill="#9aa1b2" xml:space="preserve">BulkSeq Studio — reproducible bulk RNA-seq from the command line.</text>
    <text x="18.0" y="148.0" fill="#9aa1b2" xml:space="preserve"></text>
    <text x="18.0" y="168.0" fill="#9aa1b2" xml:space="preserve">positional arguments:</text>
    <text x="18.0" y="188.0" fill="#9aa1b2" xml:space="preserve">  COMMAND</text>
    <text x="18.0" y="208.0" fill="#9aa1b2" xml:space="preserve">    version             print the version</text>
    <text x="18.0" y="228.0" fill="#9aa1b2" xml:space="preserve">    project             create and inspect projects</text>
    <text x="18.0" y="248.0" fill="#9aa1b2" xml:space="preserve">    config              read and edit the configuration</text>
    <text x="18.0" y="268.0" fill="#9aa1b2" xml:space="preserve">    samples             inspect the sample sheet</text>
    <text x="18.0" y="288.0" fill="#9aa1b2" xml:space="preserve">    check               validate the sample sheet and design</text>
    <text x="18.0" y="308.0" fill="#9aa1b2" xml:space="preserve">    print-command       show the Snakemake invocation without running it</text>
    <text x="18.0" y="328.0" fill="#9aa1b2" xml:space="preserve"></text>
    <text x="18.0" y="348.0" fill="#9aa1b2" xml:space="preserve">options:</text>
    <text x="18.0" y="368.0" fill="#9aa1b2" xml:space="preserve">  -h, --help            show this help message and exit</text>
    <text x="18.0" y="388.0" fill="#9aa1b2" xml:space="preserve">  -C PATH, --project PATH</text>
    <text x="18.0" y="408.0" fill="#9aa1b2" xml:space="preserve">                        project root (default: current directory)</text>
    <text x="18.0" y="428.0" fill="#9aa1b2" xml:space="preserve">  --json                machine-readable output on stdout; implies --quiet</text>
    <text x="18.0" y="448.0" fill="#9aa1b2" xml:space="preserve">  --quiet               suppress the banner</text>
  </g>
</svg>
