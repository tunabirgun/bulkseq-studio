<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560" role="img"><title>Synthetic fixture call overlap</title><rect width="100%" height="100%" fill="white"/><g fill="black" stroke="black" font-family="Times New Roman,serif"><text x="36" y="44" font-size="24">Calls in the synthetic fixture</text><rect x="70" y="390" width="92" height="0" fill="#3158c9"/><text x="116" y="376" text-anchor="middle" font-size="24">0</text><text x="116" y="424" text-anchor="middle" font-size="15">Combined only</text><rect x="260" y="220" width="92" height="170" fill="#3158c9"/><text x="306" y="206" text-anchor="middle" font-size="24">1</text><text x="306" y="424" text-anchor="middle" font-size="15">Both</text><rect x="450" y="220" width="92" height="170" fill="#3158c9"/><text x="496" y="206" text-anchor="middle" font-size="24">1</text><text x="496" y="424" text-anchor="middle" font-size="15">Per-study only</text><rect x="640" y="220" width="92" height="170" fill="#3158c9"/><text x="686" y="206" text-anchor="middle" font-size="24">1</text><text x="686" y="424" text-anchor="middle" font-size="15">Neither</text><path d="M52 390H835" stroke="#555"/><text x="36" y="478" font-size="14">Combined call: matching-sign combined-p FDR below 0.05. Per-study call: adjusted p below 0.05.</text><text x="36" y="502" font-size="14">The fixture does not apply a fold-change screen to either bar category.</text></g></svg>