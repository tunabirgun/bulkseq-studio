<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560" role="img"><title>Pooled effect for synthetic feature up</title><rect width="100%" height="100%" fill="white"/><g fill="black" stroke="black" font-family="Times New Roman,serif"><text x="36" y="44" font-size="24">Pooled effect for synthetic feature up</text><path d="M190.0 74V390" stroke="#777" stroke-dasharray="5 5"/><text x="36" y="128" font-size="18">Study A</text><path d="M191.9 122H376.1" stroke-width="2"/><rect x="274.0" y="112.0" width="20.0" height="20.0"/><text x="860" y="128" text-anchor="end" font-size="15">0.40 [0.01, 0.79]</text><text x="36" y="216" font-size="18">Study B</text><path d="M264.3 210H632.7" stroke-width="2"/><rect x="443.5" y="205.0" width="10.0" height="10.0"/><text x="860" y="216" text-anchor="end" font-size="15">1.10 [0.32, 1.88]</text><path d="M36 292H864" stroke="#999"/><text x="36" y="336" font-size="18">Common effect</text><polygon points="234.5,330 316.9,315 399.3,330 316.9,345" fill="#3158c9" stroke="#3158c9"/><text x="860" y="336" text-anchor="end" font-size="15">0.54 [0.19, 0.89]</text><path d="M190 408H660" stroke="#555"/><text x="190.0" y="432" text-anchor="middle" font-size="14">0</text><text x="425.0" y="432" text-anchor="middle" font-size="14">1</text><text x="660.0" y="432" text-anchor="middle" font-size="14">2</text><text x="425" y="468" text-anchor="middle" font-size="16">log2 fold change (case vs control), 95% confidence intervals</text><text x="36" y="508" font-size="14">Synthetic study-level fixture. Squares are study estimates; diamond is the fixed-effect estimate.</text><text x="36" y="530" font-size="14">Square area is proportional to fixed-effect inverse-variance weight. This is a pooled-effect display, not a combined-p significance display.</text></g></svg>