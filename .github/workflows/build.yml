name: Build packages

# Packaging build for both supported package targets: a Windows installer + portable
# ZIP and a Linux AppImage + portable archive. Each job runs the frozen QtWebEngine
# self-test before uploading release artifacts.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Keep the one Python version in sync across all three OS jobs; matches the
  # local .venv (3.12.10) and satisfies pyproject.toml's requires-python >=3.11.
  PYTHON_VERSION: "3.12"

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt

      - name: Create venv and install dependencies
        shell: powershell
        run: |
          python -m venv .venv
          .venv\Scripts\python.exe -m pip install --upgrade pip
          .venv\Scripts\python.exe -m pip install -r requirements.txt -r requirements-build.txt -c constraints.txt

      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup --no-progress -y

      - name: Build installer + portable ZIP
        shell: powershell
        run: .\scripts\build_release.ps1

      # Runs the installer on the CI runner itself, not a clean machine: it proves the
      # installer's silent switches, registry key and update/uninstall branches work on a
      # box that already has this repo's build tooling, not that a bare Windows image with
      # nothing preinstalled can run it end to end.
      - name: Install silently and verify
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $version = (Select-String -Path app\constants.py -Pattern 'APP_VERSION\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          $setup = "installer_output\BulkSeqStudio-Setup-$version.exe"
          $exe = "$env:LOCALAPPDATA\Programs\BulkSeq Studio\BulkSeqStudio.exe"
          $uninstKey = "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\{B7E4B2A1-6F1C-4E1A-9C2A-BULKSEQSTUDIO}}_is1"
          $sentinel = "$env:RUNNER_TEMP\bulkseq-install-selftest.json"

          function Assert-SelfTest {
            param($Sentinel)
            Remove-Item $Sentinel -ErrorAction SilentlyContinue
            $env:QT_QPA_PLATFORM = "offscreen"
            $env:BULKSEQ_SKIP_READINESS_DIALOG = "1"
            $env:BULKSEQ_SELFTEST = "1"
            $env:BULKSEQ_SELFTEST_OUT = $Sentinel
            # The known frozen-teardown crash (0xC0000409) can follow a passing self-test,
            # so the sentinel's pass:true is the gate, not the process exit code.
            $p = Start-Process -FilePath $exe -PassThru
            if (-not $p.WaitForExit(90000)) {
              try { $p.Kill() } catch {}
              throw "self-test process did not exit within 90s"
            }
            if (-not (Test-Path $Sentinel)) { throw "self-test sentinel was not written" }
            $result = Get-Content $Sentinel -Raw | ConvertFrom-Json
            if ($result.pass -ne $true) { throw "self-test reported failure: $($result | ConvertTo-Json)" }
          }

          function Run-Installer {
            param($Exe, $Log)
            $p = Start-Process -FilePath $Exe -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/LOG=$Log" -Wait -PassThru
            if ($p.ExitCode -ne 0) {
              Get-Content $Log -ErrorAction SilentlyContinue
              throw "installer exited with code $($p.ExitCode)"
            }
          }

          Run-Installer $setup "$env:RUNNER_TEMP\install-1.log"
          if (-not (Test-Path $uninstKey)) { throw "uninstall registry key missing after install" }
          if (-not (Test-Path $exe)) { throw "installed executable missing: $exe" }
          Assert-SelfTest $sentinel

          # Second install exercises the update branch (InitializeSetup detects the
          # existing install and uninstalls it before reinstalling).
          Run-Installer $setup "$env:RUNNER_TEMP\install-2.log"
          if (-not (Test-Path $uninstKey)) { throw "uninstall registry key missing after update install" }
          if (-not (Test-Path $exe)) { throw "installed executable missing after update install: $exe" }
          Assert-SelfTest $sentinel

          $uninstString = (Get-ItemProperty $uninstKey).UninstallString
          $uninstString = $uninstString -replace '"', ''
          Run-Installer $uninstString "$env:RUNNER_TEMP\uninstall.log"
          $waited = 0
          while ((Test-Path $uninstKey) -and $waited -lt 30000) { Start-Sleep -Milliseconds 500; $waited += 500 }
          if (Test-Path $uninstKey) {
            Get-Content "$env:RUNNER_TEMP\uninstall.log" -ErrorAction SilentlyContinue
            throw "uninstall registry key still present after uninstall"
          }

      - name: Print installer logs on failure
        if: failure()
        shell: powershell
        run: |
          Get-ChildItem "$env:RUNNER_TEMP\install-*.log", "$env:RUNNER_TEMP\uninstall.log" -ErrorAction SilentlyContinue |
            ForEach-Object { Write-Host "----- $($_.Name) -----"; Get-Content $_.FullName }

      - uses: actions/upload-artifact@v4
        with:
          name: BulkSeqStudio-windows
          # gui-benchmark-runs/*.py are tracked in git under installer_output/ (the
          # test harness needs a fixed on-disk path) even though the rest of that
          # directory is gitignored build output; exclude it so a fresh checkout
          # does not smuggle the dev-only harness into the release artifact.
          path: |
            installer_output/*
            !installer_output/gui-benchmark-runs/**
          if-no-files-found: error

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt

      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-cursor0

      - name: Create venv and install dependencies
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -r requirements.txt -r requirements-build.txt -c constraints.txt

      - name: Build onedir with PyInstaller
        run: .venv/bin/python -m PyInstaller packaging/BulkSeqStudio.spec --noconfirm

      - name: Verify frozen onedir
        run: |
          set -euo pipefail
          SENTINEL="$RUNNER_TEMP/bulkseq-onedir-selftest.json"
          timeout 90s env \
            QT_QPA_PLATFORM=offscreen \
            BULKSEQ_SKIP_READINESS_DIALOG=1 \
            BULKSEQ_SELFTEST=1 \
            BULKSEQ_SELFTEST_OUT="$SENTINEL" \
            "dist/BulkSeq Studio/BulkSeqStudio"
          .venv/bin/python - "$SENTINEL" <<'PY'
          import json, pathlib, sys
          result = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))
          assert result.get("pass") is True, result
          assert result.get("webengine") is True, result
          assert result.get("nodes") == 3, result
          PY

      - name: Fetch appimagetool
        run: |
          set -euo pipefail
          curl -fL -o "$RUNNER_TEMP/appimagetool" \
            "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage"
          echo "a6d71e2b6cd66f8e8d16c37ad164658985e0cf5fcaa950c90a482890cb9d13e0  $RUNNER_TEMP/appimagetool" \
            | sha256sum --check --strict
          chmod +x "$RUNNER_TEMP/appimagetool"
          echo "APPIMAGETOOL=$RUNNER_TEMP/appimagetool" >> "$GITHUB_ENV"

      - name: Build AppImage
        run: |
          set -euo pipefail
          VERSION="$(.venv/bin/python -c "
          import re
          print(re.search(r'APP_VERSION\s*=\s*\"([^\"]+)\"', open('app/constants.py').read()).group(1))
          ")"
          mkdir -p installer_output
          # Invoked through `bash` rather than directly: this repo is developed on
          # Windows with core.filemode=false, so shell scripts are committed 100644 and
          # executing them directly fails with "permission denied" on the runner.
          bash packaging/build_appimage.sh "dist/BulkSeq Studio" "$VERSION" installer_output

      - name: Verify AppImage and zsync metadata
        run: |
          set -euo pipefail
          VERSION="$(.venv/bin/python -c 'from app.constants import APP_VERSION; print(APP_VERSION)')"
          APPIMAGE="installer_output/BulkSeqStudio-${VERSION}-x86_64.AppImage"
          SENTINEL="$RUNNER_TEMP/bulkseq-appimage-selftest.json"
          timeout 90s env \
            APPIMAGE_EXTRACT_AND_RUN=1 \
            QT_QPA_PLATFORM=offscreen \
            BULKSEQ_SKIP_READINESS_DIALOG=1 \
            BULKSEQ_SELFTEST=1 \
            BULKSEQ_SELFTEST_OUT="$SENTINEL" \
            "$APPIMAGE"
          .venv/bin/python - "$SENTINEL" "$APPIMAGE" <<'PY'
          import hashlib, json, pathlib, sys
          result = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))
          assert result.get("pass") is True, result
          assert result.get("webengine") is True, result
          assert result.get("nodes") == 3, result
          appimage = pathlib.Path(sys.argv[2])
          zsync = pathlib.Path(f"{appimage}.zsync")
          version = appimage.name.removeprefix("BulkSeqStudio-").removesuffix("-x86_64.AppImage")
          portable = appimage.with_name(f"BulkSeqStudio-Portable-{version}-linux-x86_64.tar.gz")
          assert appimage.is_file() and appimage.stat().st_size > 0
          assert zsync.is_file() and zsync.stat().st_size > 0
          assert portable.is_file() and portable.stat().st_size > 0
          header = zsync.read_text(encoding="utf-8", errors="replace")
          assert f"Filename: {appimage.name}" in header
          assert f"Length: {appimage.stat().st_size}" in header
          digest = hashlib.sha1()
          with appimage.open("rb") as handle:
              for chunk in iter(lambda: handle.read(8 * 1024 * 1024), b""):
                  digest.update(chunk)
          assert digest.hexdigest() in header.lower()
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: BulkSeqStudio-linux
          # See the Windows job's upload step: gui-benchmark-runs/*.py are tracked
          # in git under installer_output/ and must not ship as a release asset.
          path: |
            installer_output/*
            !installer_output/gui-benchmark-runs/**
          if-no-files-found: error
