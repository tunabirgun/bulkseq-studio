name: Build packages

# Tri-platform packaging build: Windows installer + portable ZIP (Inno Setup,
# scripts/build_release.ps1), Linux AppImage (packaging/build_appimage.sh),
# and a macOS .app (+ signed/notarized .dmg when signing secrets are present,
# scripts/build_macos.sh). PR builds from forks have no secrets, so the macOS
# job's sign/notarize steps are skipped there and it still uploads the
# unsigned .app for smoke-testing that the build itself works.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Keep the one Python version in sync across all three OS jobs; matches the
  # local .venv (3.12.10) and satisfies pyproject.toml's requires-python >=3.11.
  PYTHON_VERSION: "3.12"

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt

      - name: Create venv and install dependencies
        shell: powershell
        run: |
          python -m venv .venv
          .venv\Scripts\python.exe -m pip install --upgrade pip
          .venv\Scripts\python.exe -m pip install -r requirements.txt -r requirements-build.txt

      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup --no-progress -y

      - name: Build installer + portable ZIP
        shell: powershell
        run: .\scripts\build_release.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: BulkSeqStudio-windows
          path: installer_output/*
          if-no-files-found: error

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt

      - name: Create venv and install dependencies
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -r requirements.txt -r requirements-build.txt

      - name: Build onedir with PyInstaller
        run: .venv/bin/python -m PyInstaller packaging/BulkSeqStudio.spec --noconfirm

      - name: Fetch appimagetool
        run: |
          set -euo pipefail
          curl -fL -o "$RUNNER_TEMP/appimagetool" \
            "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage"
          chmod +x "$RUNNER_TEMP/appimagetool"
          echo "APPIMAGETOOL=$RUNNER_TEMP/appimagetool" >> "$GITHUB_ENV"

      - name: Build AppImage
        run: |
          set -euo pipefail
          VERSION="$(.venv/bin/python -c "
          import re
          print(re.search(r'APP_VERSION\s*=\s*\"([^\"]+)\"', open('app/constants.py').read()).group(1))
          ")"
          mkdir -p installer_output
          # Invoked through `bash` rather than directly: this repo is developed on
          # Windows with core.filemode=false, so shell scripts are committed 100644 and
          # executing them directly fails with "permission denied" on the runner.
          bash packaging/build_appimage.sh "dist/BulkSeq Studio" "$VERSION" installer_output

      - uses: actions/upload-artifact@v4
        with:
          name: BulkSeqStudio-linux
          path: installer_output/*
          if-no-files-found: error

  macos:
    # GA Apple Silicon (arm64) runner. Never macos-latest: that label's
    # underlying architecture has changed before (Intel -> Apple Silicon), and
    # this project is Apple-Silicon-only (macOS 27, M-series). Confirmed
    # current label mapping (macos-26 = macOS 26 Arm64, GA, not xlarge/preview):
    # https://github.com/actions/runner-images/blob/main/README.md
    runs-on: macos-26
    # `secrets` is NOT an available context in a step-level `if:` — GitHub's context
    # availability table lists only github/needs/strategy/matrix/job/runner/env/vars/
    # steps/inputs there. Referencing it in `if:` is a workflow syntax error, which
    # fails the whole job rather than skipping the step. Mapping the secrets onto
    # job-level env here lets the signing steps test `env.* != ''` instead, which is
    # the documented workaround and keeps fork PRs (no secrets) building unsigned.
    env:
      APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
      APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt

      - name: Create venv and install dependencies
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -r requirements.txt -r requirements-build.txt

      # Standard GitHub-documented recipe for getting a Developer ID certificate
      # onto a macOS runner's keychain:
      # https://docs.github.com/actions/use-cases-and-examples/deploying/installing-an-apple-certificate-on-macos-runners-for-xcode-development
      # Skipped entirely when the secret is absent (PR builds from forks never
      # have it) so this step never fails a PR build for lacking credentials.
      - name: Import signing certificate
        if: ${{ env.APPLE_CERTIFICATE_P12 != '' }}
        env:
          CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.APPLE_KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          CERT_PATH="$RUNNER_TEMP/build_certificate.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          echo -n "$CERTIFICATE_P12_BASE64" | base64 --decode -o "$CERT_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | sed 's/"//g')
          rm -f "$CERT_PATH"

      # App Store Connect API key auth for notarytool (avoids storing an
      # app-specific password). The .p8 key content is the secret; it is
      # written to a runner-local temp file here and never echoed.
      - name: Write notary API key
        if: ${{ env.APPLE_API_KEY_P8 != '' }}
        env:
          API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/private_keys"
          printf '%s' "$API_KEY_P8" > "$RUNNER_TEMP/private_keys/AuthKey.p8"
          echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/private_keys/AuthKey.p8" >> "$GITHUB_ENV"

      - name: Build (and sign/notarize/package when secrets are configured)
        env:
          CODESIGN_IDENTITY: ${{ secrets.APPLE_CODESIGN_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        # Via `bash` for the same reason as the AppImage step: the repo is developed on
        # Windows (core.filemode=false), so the script is committed without its exec bit.
        run: bash scripts/build_macos.sh

      - uses: actions/upload-artifact@v4
        with:
          name: BulkSeqStudio-macos-app
          path: dist/BulkSeq Studio.app
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: BulkSeqStudio-macos-dmg
          path: installer_output/*.dmg
          if-no-files-found: ignore
