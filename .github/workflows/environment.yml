name: Environment

# Live execution of scripts/setup_wsl_bioenv.sh -- CI running the real installer on a fresh
# ubuntu-latest runner, not clean-machine verification. It cannot see a Windows/WSL2-specific
# failure mode; it only proves the channels still solve and the R stack still loads on
# native Linux, cheaply and on a schedule, instead of only when a user hits it.
#
# Kept separate from tests.yml and out of the release gate: scripts/release.ps1 matches
# workflow runs by name ("Tests", "Build packages") and this workflow is neither.

on:
  push:
    branches: [main]
    paths:
      - scripts/setup_wsl_bioenv.sh
      - workflow/envs/**
      - .github/workflows/environment.yml
  pull_request:
    paths:
      - scripts/setup_wsl_bioenv.sh
      - workflow/envs/**
      - .github/workflows/environment.yml
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      full_smoke:
        description: Run bounded synthetic backend functions and retain figures for review
        type: boolean
        required: true
        default: false

concurrency:
  group: environment-${{ github.ref }}
  cancel-in-progress: true

# Nothing here writes to the repository: the jobs only install and run the environment.
permissions:
  contents: read

jobs:
  install-core:
    name: install core profile (live)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run the installer (core profile)
        run: bash scripts/setup_wsl_bioenv.sh bulkseq core
      - name: Print the recorded spec marker
        run: cat "$HOME/micromamba/envs/bulkseq/.bulkseq_spec"

  install-full:
    name: install full profile (live)
    runs-on: ubuntu-latest
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Run the installer (full profile)
        run: bash scripts/setup_wsl_bioenv.sh bulkseq full
      - name: Print the recorded spec marker
        run: cat "$HOME/micromamba/envs/bulkseq/.bulkseq_spec"
      - name: Select the installed full environment for manual smoke
        if: github.event_name == 'workflow_dispatch' && inputs.full_smoke
        run: |
          echo "$HOME/micromamba/envs/bulkseq/bin" >> "$GITHUB_PATH"
          echo "BULKSEQ_SMOKE_ROOT=$RUNNER_TEMP/backend-smoke" >> "$GITHUB_ENV"
      - name: Prepare fixed synthetic inputs and projects
        if: github.event_name == 'workflow_dispatch' && inputs.full_smoke
        run: |
          test "$(command -v python)" = "$HOME/micromamba/envs/bulkseq/bin/python"
          test "$(command -v Rscript)" = "$HOME/micromamba/envs/bulkseq/bin/Rscript"
          python tests/backend_smoke/00_profile.py "$BULKSEQ_SMOKE_ROOT" prepare
          python tests/backend_smoke/01_prepare.py
          python tests/backend_smoke/06_legacy_reporting.py
          python tests/backend_smoke/00_receipt.py prepare
      - name: Salmon to tximport gene counts
        if: github.event_name == 'workflow_dispatch' && inputs.full_smoke
        run: |
          python tests/backend_smoke/00_profile.py "$BULKSEQ_SMOKE_ROOT" salmon
          timeout 1200s /usr/bin/time -v bash tests/backend_smoke/02_salmon.sh
          python tests/backend_smoke/02_check_salmon.py
          bash tests/backend_smoke/00_negative.sh 02_check_salmon.py --negative-count 'gene counts differ from independent lengthScaledTPM'
          python tests/backend_smoke/00_receipt.py salmon
      - name: Packaged RiboDetector classification
        if: github.event_name == 'workflow_dispatch' && inputs.full_smoke
        run: |
          python tests/backend_smoke/00_profile.py "$BULKSEQ_SMOKE_ROOT" ribodetector
          python tests/backend_smoke/03_packaged_model.py
          timeout 600s /usr/bin/time -v bash tests/backend_smoke/03_ribodetector.sh
          python tests/backend_smoke/03_check_ribodetector.py
          bash tests/backend_smoke/00_negative.sh 03_check_ribodetector.py --negative-sequence 'RiboDetector changed read identities'
          python tests/backend_smoke/00_receipt.py ribodetector
      - name: Differential expression and main figures
        if: github.event_name == 'workflow_dispatch' && inputs.full_smoke
        run: |
          python tests/backend_smoke/00_profile.py "$BULKSEQ_SMOKE_ROOT" main
          timeout 1200s /usr/bin/time -v bash tests/backend_smoke/04_main.sh
          python tests/backend_smoke/04_check_main.py
          bash tests/backend_smoke/00_negative.sh 04_check_main.py --negative-bh 'Main DESeq2 BH family disagrees'
          bash tests/backend_smoke/00_negative.sh 04_check_main.py --negative-effect 'Main model lost a planted effect direction'
          python tests/backend_smoke/00_receipt.py main
      - name: Two-study meta-analysis and full-family BH
        if: github.event_name == 'workflow_dispatch' && inputs.full_smoke
        run: |
          python tests/backend_smoke/00_profile.py "$BULKSEQ_SMOKE_ROOT" meta
          timeout 1200s /usr/bin/time -v bash tests/backend_smoke/05_meta.sh
          python tests/backend_smoke/05_check_meta.py
          bash tests/backend_smoke/00_negative.sh 05_check_meta.py --negative-fdr 'Pooled-effect BH family disagrees'
          python tests/backend_smoke/00_receipt.py meta
      - name: Custom enrichment with reviewed legacy reporting
        if: github.event_name == 'workflow_dispatch' && inputs.full_smoke
        run: |
          python tests/backend_smoke/00_profile.py "$BULKSEQ_SMOKE_ROOT" custom_old
          timeout 1200s /usr/bin/time -v bash tests/backend_smoke/06_custom_old.sh
          python tests/backend_smoke/00_receipt.py custom_old
      - name: Custom enrichment with current reporting
        if: github.event_name == 'workflow_dispatch' && inputs.full_smoke
        run: |
          python tests/backend_smoke/00_profile.py "$BULKSEQ_SMOKE_ROOT" custom_new
          timeout 1200s /usr/bin/time -v bash tests/backend_smoke/07_custom_new.sh
          python tests/backend_smoke/07_check_custom.py
          bash tests/backend_smoke/00_negative.sh 07_check_custom.py --negative-padj 'Custom-enrichment scientific output changed'
          python tests/backend_smoke/00_receipt.py custom_new
      - name: Gene-set variation scores
        if: github.event_name == 'workflow_dispatch' && inputs.full_smoke
        run: |
          python tests/backend_smoke/00_profile.py "$BULKSEQ_SMOKE_ROOT" gsva
          timeout 1200s /usr/bin/time -v bash tests/backend_smoke/08_gsva.sh
          python tests/backend_smoke/08_check_gsva.py
          bash tests/backend_smoke/00_negative.sh 08_check_gsva.py --negative-nan 'GSVA scores are incomplete or non-finite'
          python tests/backend_smoke/00_receipt.py gsva
      - name: Final custom enrichment report
        if: github.event_name == 'workflow_dispatch' && inputs.full_smoke
        run: |
          python tests/backend_smoke/00_profile.py "$BULKSEQ_SMOKE_ROOT" custom_report
          timeout 1200s /usr/bin/time -v bash tests/backend_smoke/09_custom_report.sh
          python tests/backend_smoke/09_check_custom_report.py
          bash tests/backend_smoke/00_negative.sh 09_check_custom_report.py --negative-population 'Final custom ORA report omitted'
          python tests/backend_smoke/00_receipt.py custom_report
      - name: Fetch bounded official yeast STRING cache
        if: github.event_name == 'workflow_dispatch' && inputs.full_smoke
        run: |
          python tests/backend_smoke/00_profile.py "$BULKSEQ_SMOKE_ROOT" string
          bash tests/backend_smoke/00_negative.sh 10_string_cache.py --negative-cap 'STRING advertised transfer exceeds cap'
          bash tests/backend_smoke/00_negative.sh 10_string_cache.py --negative-redirect 'Redirect refused'
          timeout 300s python tests/backend_smoke/10_string_cache.py
          python tests/backend_smoke/00_receipt.py string
      - name: Sparse public-seed STRING graph
        if: github.event_name == 'workflow_dispatch' && inputs.full_smoke
        run: |
          python tests/backend_smoke/00_profile.py "$BULKSEQ_SMOKE_ROOT" ppi
          timeout 660s /usr/bin/time -v bash tests/backend_smoke/11_sparse_ppi.sh
          python tests/backend_smoke/11_check_ppi.py
          bash tests/backend_smoke/00_negative.sh 11_check_ppi.py --negative-score 'Sparse STRING edge identity or score is invalid'
          bash tests/backend_smoke/00_negative.sh 11_check_ppi.py --negative-edge 'Sparse STRING edges disagree with official cached links'
          python tests/backend_smoke/00_receipt.py ppi
      - name: Retain bounded synthetic outputs for independent review
        if: github.event_name == 'workflow_dispatch' && inputs.full_smoke
        run: |
          python tests/backend_smoke/12_artifact.py --test-derivative
          python tests/backend_smoke/12_artifact.py --test-dpi-roundtrip
          bash tests/backend_smoke/00_negative.sh 12_artifact.py --negative-path 'Artifact path is not relative and portable'
          bash tests/backend_smoke/00_negative.sh 12_artifact.py --negative-pixel 'PNG pixel content changed'
          bash tests/backend_smoke/00_negative.sh 12_artifact.py --negative-identifier 'Optional identifier or machine path remains'
          bash tests/backend_smoke/00_negative.sh 12_artifact.py --negative-link 'Retained HTML link escapes'
          bash tests/backend_smoke/00_negative.sh 12_artifact.py --negative-missing-link 'Retained HTML link lacks its source target'
          bash tests/backend_smoke/00_negative.sh 12_artifact.py --negative-receipt 'Missing successful phase receipt'
          python tests/backend_smoke/12_artifact.py
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch' && inputs.full_smoke
        with:
          name: backend-synthetic-smoke
          path: ${{ runner.temp }}/backend-smoke/artifact/
          if-no-files-found: error
          retention-days: 7

  # This Linux-hosted dry solve tracks osx-arm64 package availability only. The shipped
  # installer currently refuses macOS; solver success does not verify a Mac backend,
  # split-prefix provisioning or native execution.
  osx-arm64-solve:
    name: osx-arm64 solve (dry run)
    runs-on: ubuntu-latest
    env:
      # The packages this project cannot install on osx-arm64, each followed by the
      # dependency that makes it unavailable where that is not the package itself (see the
      # gating lists in app/core/readiness.py). This one list
      # drives the filter and the assertions below: when a build lands, the package starts
      # solving, the "still unavailable" check fails, and the line is what gets edited.
      UNAVAILABLE: >-
        sortmerna
        fastq-screen:perl-gd
        bioconductor-gsva
        bioconductor-affy:bioconductor-affyio
      # __osx is a virtual package the Linux runner cannot report. Without it every solve
      # below fails on the missing __osx instead of on the package under test.
      CONDA_OVERRIDE_OSX: "11.0"

    steps:
      - uses: actions/checkout@v4

      - uses: mamba-org/setup-micromamba@v2
        with:
          # Pinned: the solver's answer is the result this job reports, so it must not
          # change under the job without the change being visible here.
          micromamba-version: 2.8.1-1
          init-shell: bash

      - name: Derive the osx-arm64 specs from the environment files
        run: |
          mkdir -p "$RUNNER_TEMP/osx"
          python3 - "$RUNNER_TEMP/osx" <<'PY'
          import os
          import sys

          out = sys.argv[1]
          unavailable = {}
          for item in os.environ["UNAVAILABLE"].split():
              package, _, cause = item.partition(":")
              unavailable[package] = cause or package

          def entries(path):
              found, inside = [], False
              for line in open(path, encoding="utf-8"):
                  if line.startswith("dependencies:"):
                      inside = True
                  elif inside and line.strip().startswith("- "):
                      found.append(line.strip()[2:].strip())
              return found

          def name(spec):
              for separator in "=<> ":
                  spec = spec.split(separator)[0]
              return spec

          def write(stem, specs):
              with open(f"{out}/{stem}.yaml", "w", encoding="utf-8") as handle:
                  handle.write("name: probe\nchannels:\n  - conda-forge\n  - bioconda\n")
                  handle.write("dependencies:\n")
                  handle.writelines(f"  - {spec}\n" for spec in specs)
              return specs

          core = entries("workflow/envs/bulkseq_core.yaml")
          full = entries("workflow/envs/bulkseq_full.yaml")
          r_block = [s for s in full if name(s).startswith(("r-", "bioconductor-"))]
          r_base = next(s for s in r_block if name(s) == "r-base")

          requested = {name(spec): spec for spec in core + r_block}
          unknown = sorted(set(unavailable) - set(requested))
          if unknown:
              sys.exit(f"UNAVAILABLE names packages no environment file requests: {unknown}")

          tools = write("tools", [s for s in core if name(s) not in unavailable])
          r_only = write("r", [s for s in r_block if name(s) not in unavailable])
          write("tools_unfiltered", core)
          write("full_unfiltered", full)
          # Each unavailable package on its own, an R package against the pinned r-base:
          # bioconductor-affy installs on osx-arm64 under an older R and is unavailable only
          # at this pin. A command-line tool is probed without r-base, because the pin would
          # fail it on the libdeflate conflict and hide whether the tool itself is there.
          tool_names = {name(spec) for spec in core}
          for package in unavailable:
              spec = requested[package]
              write(f"one_{package}", [spec] if package in tool_names else [r_base, spec])
          print(f"{len(tools)} tool specs, {len(r_only)} R specs, filtered {sorted(unavailable)}")
          PY

      - name: The filtered tool and R specs must solve for osx-arm64
        shell: bash
        run: |
          for spec in tools r; do
            "$MAMBA_EXE" create --dry-run --yes --platform osx-arm64 --name probe \
              --file "$RUNNER_TEMP/osx/$spec.yaml"
          done

      - name: Every filtered-out package must still be unavailable on osx-arm64
        shell: bash
        run: |
          solve() {
            local status=0
            "$MAMBA_EXE" create --dry-run --yes --platform osx-arm64 --name probe \
              --file "$RUNNER_TEMP/osx/$1.yaml" > "$RUNNER_TEMP/osx/$1.log" 2>&1 || status=$?
            echo "$1: solver exit $status"
            return "$status"
          }
          failed=0
          # The unfiltered specs show whether this availability filter is still needed.
          for spec in tools_unfiltered full_unfiltered; do
            if solve "$spec"; then
              echo "::error::$spec solved for osx-arm64; the documented unavailability is stale"
              failed=1
            fi
          done
          for item in $UNAVAILABLE; do
            package="${item%%:*}"
            cause="${item##*:}"
            if solve "one_$package"; then
              echo "::error::$package now installs on osx-arm64: drop it from UNAVAILABLE," \
                   "from app/core/readiness.py and from the macOS notes"
              failed=1
              continue
            fi
            for named in "$package" "$cause"; do
              grep -qF -- "$named" "$RUNNER_TEMP/osx/one_$package.log" || {
                echo "::error::the $package solve failed without naming $named"
                cat "$RUNNER_TEMP/osx/one_$package.log"
                failed=1
              }
            done
          done
          exit "$failed"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-solver-evidence
          path: ${{ runner.temp }}/osx/
          if-no-files-found: warn
