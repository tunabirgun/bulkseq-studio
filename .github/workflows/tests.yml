name: Tests

# The suite runs on both supported platforms on every push and pull request.
#
# Both matter, and neither substitutes for the other: several tests are skipped on one
# platform and only execute on the other. The POSIX process-group termination test
# (tests/test_cross_platform.py) skips on Windows entirely, and the WSL probes skip on
# Linux — so a single-platform run reports green while leaving real code unexercised.
#
# QT_QPA_PLATFORM=offscreen lets the GUI tests construct real widgets on a runner with no
# display. It renders glyphs as empty boxes, which is fine for behavioural assertions and
# useless for anything visual — do not add pixel comparisons here.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  # A newer push supersedes an in-flight run on the same ref.
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

jobs:
  pytest:
    name: pytest (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # Do not cancel the other platform when one fails: a platform-specific failure is
      # exactly the thing this matrix exists to surface, and hiding the other half of the
      # result makes it harder to tell which.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install "pytest>=8.2"

      # Qt needs these shared libraries present even under the offscreen platform plugin;
      # a bare ubuntu runner has none of them and every GUI test fails to import.
      - name: Install Qt runtime libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-cursor0

      - name: Run the test suite
        env:
          QT_QPA_PLATFORM: offscreen
          BULKSEQ_SKIP_READINESS_DIALOG: "1"
        run: python -m pytest -q --tb=short

  # The figure contracts that actually execute R (label-layout angles, the volcano ranked
  # key, the sample-distance gradient legend) skip themselves when Rscript is missing, and
  # neither runner above has R -- so those gates never ran anywhere. This job installs R and
  # sets BULKSEQ_REQUIRE_R=1, which turns every one of those skips into a failure.
  #
  # The R package list is what the executed helper slices and their harness scripts call:
  # ggplot2 and svglite (grid/grDevices are base; systemfonts arrives with svglite). Nothing
  # here sources a whole pipeline script, so pheatmap and the Bioconductor stack stay out.
  figure-contracts:
    name: figure contracts (R)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: r-lib/actions/setup-r@v2
        with:
          # Match the pinned pipeline R (workflow/envs); use-public-rspm serves binaries, so
          # ggplot2 does not get built from source on every run.
          r-version: "4.5.2"
          use-public-rspm: true

      - name: Install the R packages the executed contracts need
        run: Rscript -e 'install.packages(c("ggplot2", "svglite"))'

      - name: Install pytest
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pytest>=8.2"

      - name: Run the figure contracts with R mandatory
        env:
          BULKSEQ_REQUIRE_R: "1"
        run: python -m pytest -q --tb=short tests/test_figure_rendering_contracts.py
