name: Tests

# The suite runs on every supported platform on every push and pull request.
#
# Each matters, and none substitutes for another: several tests are skipped on one platform
# and only execute on the others. The POSIX process-group termination test
# (tests/test_cross_platform.py) skips on Windows entirely, and the WSL probes skip on
# Linux — so a single-platform run reports green while leaving real code unexercised.
# Which tests a platform did not execute is on the run summary, not only in the log.
#
# QT_QPA_PLATFORM=offscreen lets the GUI tests construct real widgets on a runner with no
# display. It renders glyphs as empty boxes, which is fine for behavioural assertions and
# useless for anything visual — do not add pixel comparisons here.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  # A newer push supersedes an in-flight run on the same ref.
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

jobs:
  pytest:
    name: pytest (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # Do not cancel the other platform when one fails: a platform-specific failure is
      # exactly the thing this matrix exists to surface, and hiding the other half of the
      # result makes it harder to tell which.
      fail-fast: false
      matrix:
        # macos-latest covers the GUI, configuration and validation layer on darwin only.
        # The pipeline itself cannot run there: it needs the WSL/native-Linux bioinformatics
        # environment, so every test that shells out to it skips and says so in the summary.
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: one negative control reads the previous release's renderer out
          # of git history, and a shallow clone makes it skip. A control that silently
          # stops running in CI is the failure mode this suite exists to prevent.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -c constraints.txt
          python -m pip install "pytest>=8.2"

      # Qt needs these shared libraries present even under the offscreen platform plugin;
      # a bare ubuntu runner has none of them and every GUI test fails to import.
      - name: Install Qt runtime libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-cursor0

      # docs/ is build output: a hand-edited page survives until the next build, and a
      # rebuild that was never committed publishes the previous release's text. Rebuilding
      # here and requiring git to see nothing is a tree-level cross-check of the in-process
      # comparison in tests/test_docs_site.py, not a duplicate of it: that gate globs the
      # working tree, so a built page that was never added to git passes there and fails
      # here. It is not a superset either -- porcelain omits ignored paths, which only the
      # in-process comparison would catch. Linux only: node is present on that runner, and
      # one platform is enough for a check whose subject is the tree, not the OS.
      - name: Require docs/ to equal a fresh build
        if: runner.os == 'Linux'
        run: |
          node docs_src/build.mjs
          if [ -n "$(git status --porcelain -- docs/)" ]; then
            echo "docs/ differs from a fresh build of docs_src/." >&2
            echo "Run 'node docs_src/build.mjs' and commit the result." >&2
            git status --porcelain -- docs/ >&2
            # --stat only: the built pages are single-line, so a full diff dumps whole
            # pages into the log and buries which files moved.
            git --no-pager diff --stat -- docs/ >&2
            exit 1
          fi

      - name: Run the test suite
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
          BULKSEQ_SKIP_READINESS_DIALOG: "1"
        run: python -m pytest -q -rs --tb=short | tee "$RUNNER_TEMP/pytest-suite.txt"

      # A skip is how a platform-gated test reports "not exercised here", and buried in the
      # log it reads as a pass. This lifts every skip and its reason onto the run summary, so
      # what one platform did not execute is visible next to what the others did.
      - name: Summarise skipped tests
        if: always()
        shell: bash
        run: |
          # RUNNER_TEMP is a backslash path on the Windows runner; cd into it rather
          # than gluing it in front of a glob pattern.
          cd "$RUNNER_TEMP"
          shopt -s nullglob
          for log in pytest-*.txt; do
            rows=$(sed -n 's/^SKIPPED \[[0-9]*\] \([^ ]*\): \(.*\)$/| `\1` | \2 |/p' "$log")
            {
              echo "### Skipped tests: $(basename "$log" .txt) on $RUNNER_OS"
              echo
              if [ -n "$rows" ]; then
                echo "| Test | Reason |"
                echo "| --- | --- |"
                echo "$rows"
              else
                echo "None."
              fi
              echo
            } >> "$GITHUB_STEP_SUMMARY"
          done

  # The figure contracts that actually execute R (label-layout angles, the volcano ranked
  # key, the sample-distance gradient legend) skip themselves when Rscript is missing, and
  # neither runner above has R -- so those gates never ran anywhere. This job installs R and
  # sets BULKSEQ_REQUIRE_R=1, which turns every one of those skips into a failure.
  #
  # The CRAN list is what the executed helper slices and their harness scripts call. The three
  # full-figure render tests additionally need the Bioconductor stack (DESeq2); they skip here
  # and fail only under BULKSEQ_REQUIRE_R_FULL, which the WSL/native environment run sets.
  figure-contracts:
    name: figure contracts (R)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: r-lib/actions/setup-r@v2
        with:
          # Match the pinned pipeline R (workflow/envs); use-public-rspm serves binaries, so
          # ggplot2 does not get built from source on every run.
          r-version: "4.5.2"
          use-public-rspm: true

      - name: Install the R packages the executed contracts need
        run: Rscript -e 'install.packages(c("ggplot2", "svglite", "ggrepel", "ggnewscale", "pheatmap", "jsonlite"))'

      - name: Install pytest
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pytest>=8.2"

      - name: Run the figure contracts with R mandatory
        shell: bash
        env:
          BULKSEQ_REQUIRE_R: "1"
        run: |
          python -m pytest -q -rs --tb=short tests/test_figure_rendering_contracts.py \
            | tee "$RUNNER_TEMP/pytest-figure-contracts-cran.txt"

      # The three full-figure render tests need the Bioconductor stack (DESeq2), which the
      # CRAN-only R above does not have. A separate micromamba layer supplies it, pinned to
      # the exact builds in workflow/envs/bulkseq.lock.yaml so the tested code paths match
      # the pipeline's own R. This is CI evidence with a cached solve, not a from-scratch
      # environment build every run -- cache-environment keys off the spec file's hash.
      - name: Write the minimal Bioconductor figure environment spec
        run: |
          cat > /tmp/r_figures_env.yml <<'EOF'
          name: r-figures
          channels:
            - bioconda
            - conda-forge
          dependencies:
            - r-base=4.5.2=h835929b_3
            - bioconductor-deseq2=1.50.2=r45ha27e39d_0
            - r-ggplot2=4.0.3=r45h785f33e_0
            - r-ggrepel=0.9.8=r45h3697838_0
            - r-pheatmap=1.0.13=r45hc72bb7e_1
            - r-svglite=2.2.2=r45h8ff94db_0
            - r-ggnewscale=0.5.2=r45hc72bb7e_1
            - r-jsonlite=2.0.0=r45h54b55ab_1
            - r-rcolorbrewer=1.1_3=r45h785f33e_4
            - r-scales=1.4.0=r45hc72bb7e_1
            # densCols in make_figures.R needs the Recommended package KernSmooth, which
            # conda's r-base does not bundle (the full lock carries it through r-recommended).
            - r-kernsmooth=2.23_26=r45ha0a88a1_1
          EOF

      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: /tmp/r_figures_env.yml
          environment-name: r-figures
          cache-environment: true
          init-shell: bash

      - name: Run the Bioconductor-dependent figure contracts
        shell: bash -el {0}
        env:
          BULKSEQ_REQUIRE_R: "1"
          BULKSEQ_REQUIRE_R_FULL: "1"
        run: |
          set -o pipefail
          python -m pytest -q -rs --tb=short tests/test_figure_rendering_contracts.py \
            | tee "$RUNNER_TEMP/pytest-figure-contracts-bioconductor.txt"

      # Same summary as the matrix job: the CRAN-only pass skips the Bioconductor renders,
      # and those skips are the reason the second pass exists.
      - name: Summarise skipped tests
        if: always()
        shell: bash
        run: |
          # RUNNER_TEMP is a backslash path on the Windows runner; cd into it rather
          # than gluing it in front of a glob pattern.
          cd "$RUNNER_TEMP"
          shopt -s nullglob
          for log in pytest-*.txt; do
            rows=$(sed -n 's/^SKIPPED \[[0-9]*\] \([^ ]*\): \(.*\)$/| `\1` | \2 |/p' "$log")
            {
              echo "### Skipped tests: $(basename "$log" .txt) on $RUNNER_OS"
              echo
              if [ -n "$rows" ]; then
                echo "| Test | Reason |"
                echo "| --- | --- |"
                echo "$rows"
              else
                echo "None."
              fi
              echo
            } >> "$GITHUB_STEP_SUMMARY"
          done

  # Static checks on the WSL/native-Linux bootstrap script. This is NOT clean-machine
  # verification -- it never runs the script, so it cannot catch a broken micromamba URL,
  # a channel that stopped serving a pinned build, or an environment that fails to solve.
  # .github/workflows/environment.yml does that, on a schedule and on changes to this
  # script or the env specs. This job only catches syntax errors and shellcheck findings
  # before either of those slower runs would.
  setup-script-static:
    name: setup script (static)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: bash -n
        run: bash -n scripts/setup_wsl_bioenv.sh

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: shellcheck
        # -S warning: two pre-existing SC2016 info notes (intentional single quotes
        # around unexpanded remote-side expressions) are not defects; gate on warning+.
        run: shellcheck -S warning scripts/setup_wsl_bioenv.sh

      - name: Extract and compile the embedded python3 bootstrap heredoc
        run: |
          awk '/^  python3 - "\$1" "\$2" "\$3" <<.PY.$/{flag=1; next} /^PY$/{flag=0} flag' \
            scripts/setup_wsl_bioenv.sh > /tmp/bootstrap_with_python3.py
          test -s /tmp/bootstrap_with_python3.py
          python3 -m py_compile /tmp/bootstrap_with_python3.py
