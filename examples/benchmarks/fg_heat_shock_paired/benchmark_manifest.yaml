id: fg_heat_shock_paired
name: Fusarium graminearum Z-3639 heat-shock paired-end
organism_name: Fusarium graminearum PH-1
source_study: PRJNA314297 (SRP071140)
geo_series: GSE78885
source_publication: Bui et al. (2016) Scientific Reports 6:28154, DOI 10.1038/srep28154 (PubMed 27306495),
  the publication ENA links from PRJNA314297
selection_policy: 'All six ENA runs of the study: one run per biological sample, three biological replicates
  per temperature.'
reference_assembly: ASM24013v3
expected:
  status: first recorded in the 0.2x-era runs; the STAR + featureCounts + DESeq2 result was reproduced
    from FASTQ under workflow version 0.31.0 on 2026-09-13, its count matrix and DESeq2 table identical
    to a v0.29.1 run of the same reads
  de_genes: 5836
  de_criterion: padj < 0.05, no log2 fold-change filter, settled by the 0.31.0 reproduction (the 0.11.0
    changelog stated the count without a significance threshold)
  de_route: STAR + featureCounts + DESeq2 at -s 2; the HISAT2 route gave 5,812 in the same 0.11.0 validation
  strandedness: 2
  strandedness_basis: counted with featureCounts -s 2 in the 0.2x-era runs
